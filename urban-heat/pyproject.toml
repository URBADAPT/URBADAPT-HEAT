# pyproject.toml
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cityheat"
version = "0.1.0"
description = "Helpers for the urban-heat notebooks"
readme = "README.md"
requires-python = ">=3.10"
# keep deps light; your env.yml can pin heavy libs
dependencies = []

[tool.hatch.build]
packages = ["cityheat"]
