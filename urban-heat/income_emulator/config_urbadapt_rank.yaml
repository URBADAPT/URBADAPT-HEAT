# ============================================================================
# URBADAPT-HEAT within-city income emulator - RANK-TARGET A/B variant
# ============================================================================
# Identical to config_urbadapt.yaml except the target is the precomputed
# within-city percentile rank (inc_pct_within_city) instead of the log relative
# index. Use this to compare transfer skill: does modelling the pure rank
# transfer better across countries than the log income-ratio?
#   python run.py --config config_urbadapt_rank.yaml   -> results_rank/
# Both configs apply the same no-census filter (drop GB), so the only difference
# is the target, making the CV Spearman comparison apples-to-apples.
# ----------------------------------------------------------------------------

# ---- STAGE 1: covariate extraction (unchanged; covariates.py already ran) ----
covariate_sources:
  boundaries_dir: "data/boundaries"
  boundaries_manifest:
    - {country: BE, file: BE_Brussels_statistical_sectors_2022.gpkg, layer: brussels_sectors,                key_col: boundary_code}
    - {country: CH, file: CH_Zurich_statistical_quarters.gpkg,       layer: zurich_quarters,                 key_col: boundary_code}
    - {country: DK, file: DK_Copenhagen_districts.gpkg,              layer: copenhagen_districts,            key_col: boundary_name}
    - {country: ES, file: ES_target_cities_postal_codes.gpkg,        layer: ES_target_cities_postal_codes,   key_col: boundary_code}
    - {country: FI, file: FI_Helsinki_postal_areas_2023.gpkg,        layer: helsinki_postal_areas,           key_col: boundary_code}
    - {country: FR, file: FR_Paris_Marseille_Lyon_IRIS_current.gpkg, layer: target_iris,                     key_col: boundary_code}
    - {country: GB, file: GB_core_cities_MSOA_2011.gpkg,             layer: target_msoa,                     key_col: boundary_code}
    - {country: IT, file: IT_target_cities_CAP.gpkg,                 layer: target_cap,                      key_col: boundary_code}
    - {country: NL, file: NL_target_cities_buurten_2023.gpkg,        layer: target_buurten,                  key_col: boundary_code}
    - {country: PT, file: PT_Lisbon_freguesias.gpkg,                 layer: PT_Lisbon_freguesias,            key_col: boundary_code}
    - {country: SE, file: SE_target_cities_RegSO_2020.gpkg,          layer: target_regso,                    key_col: boundary_code}
  work_crs: "EPSG:3035"
  ghs_pop:     "C:/Users/giaco/OneDrive - IIASA/IBGF_2024/implementation/socioecon/GHS_POP_E2020_GLOBE_R2023A_4326_3ss_V1_0.tif"
  ghs_built_v: "C:/Users/giaco/OneDrive - IIASA/IBGF_2024/implementation/socioecon/GHS_BUILT_V_E2020_GLOBE_R2023A_4326_3ss_V1_0.tif"
  ghs_built_h: "C:/Users/giaco/OneDrive - IIASA/IBGF_2024/implementation/socioecon/GHS_BUILT_H_AGBH_E2018_GLOBE_R2023A_4326_3ss_V1_0.tif"
  lcz: "C:/Users/giaco/OneDrive - IIASA/IBGF_2024/implementation/climate/lcz/lcz_filter_v3.tif"
  census_parquet: "data/gisco/Eurostat_Census-GRID_2021_V3/Eurostat_Census-GRID_2021_V3/ESTAT_Census_2021_V3.parquet"
  health_facilities:    "data/gisco/EU_health_facilites.gpkg"
  education_facilities:  "data/gisco/EU_education_facilites.gpkg"
  ucdb: "C:/Users/giaco/OneDrive - IIASA/IBGF_2024/implementation/boundaries/GHS_STAT_UCDB2015MT_GLOBE_R2019A_V1_2.gpkg"
  out_table: "data/covariates_subcity.csv"

# ---- STAGE 2: emulator ------------------------------------------------------
io:
  subdivisions: "data/covariates_subcity.csv"
  income_labels: "data/income/income_subcity_harmonized.csv"
  merge_on: ["city", "subcity_code"]
  out_dir: "results_rank"

filters:
  require_non_null: ["share_under15"]   # drop GB (no census), same as base config

columns:
  subdivision_id: "subcity_code"
  city_id: "city"
  group: "country"
  population: "pop_zone"
  income: "inc_level"

target:
  # A/B CHANGE: model the within-city percentile rank directly (0-1), not the
  # log relative index. No log transform, and no median renormalisation since a
  # rank is already a within-city quantity.
  precomputed_column: "inc_pct_within_city"
  precomputed_rank_column: "inc_pct_within_city"
  reference: "median"
  log_ratio: false

features:
  predictors:
    - pop_density
    - built_volume_pc
    - mean_building_height
    - lcz_compact_share
    - lcz_open_share
    - lcz_industrial_share
    - lcz_vegetation_share
    - share_under15
    - share_65plus
    - employment_rate
    - foreign_born_share
    - residential_churn
    - health_fac_pc
    - education_fac_pc
    - dist_to_centre
    - unit_area_km2
  within_city_transform: "zscore_within"
  context:
    - city_population
  categorical_context:
    - country

model:
  backend: "auto"
  params:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    alpha: 1.0
  weight_by_population: true

validation:
  scheme: "leave_one_country_out"
  group_column: "country"
  kfold: 5

postprocess:
  renormalise_mode: "none"   # rank target: do not rescale to a per-city median of 1
  emit_rank: true
