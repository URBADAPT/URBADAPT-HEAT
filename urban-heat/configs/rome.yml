slug: rome
city_name: Rome
base_dir: data/Rome                
drive_manifest: data_manifests/rome_gdrive.json

layers:                             
  fua: fua
  cap: cap
  cap_wgs84: cap_wgs84
  regions: regions
  muni: muni

ac:                                 
  ssp: 2
  year: 2050
  tariff_eur_per_kwh: 0.25
  capex_per_user: 500.0
  maint_rate: 0.05
  lifetime_years: 20
  gridded_file: ACgridded/ac_kWh_ssp1_ssp2_ssp3_ssp5_2010_2050.nc
  penetration_file: ACgridded/ac_penetration_ssp1_ssp2_ssp3_ssp5_2020_2050.nc

trees:                               
  capex_per_index_pt_eur: 10000000
  capex_per_tree_eur: 210
  om_per_tree_per_year_eur: 27
  lifetime_years: 25
  ramp_years: 12
  cap_uplift_0_1: 0.12
  
cba:
  discount_rate: 0.03
  horizon_years: 25

efficacy:                            
  "<15": 0.20
  "15-64": 0.30
  "65+": 0.40
  default: 0.30

files:                               
  gvi_csv: gviRome/gvi_Rome.csv
  lcz_candidates:
    - "LCZ/lcz_filter_v3.tif"
    - "LCZ/lcz_v3.tif"
  cooling_coeffs_csv: "CoolingEff/outer_2_wbgt_max.csv"
  income_csv: "income/Redditi_e_principali_variabili_IRPEF_su_base_subcom.csv"
  # daily baselines (UrbClim mean daily temperature)
  t2m_mean_daily_nc:
    dir: "UrbClim/UrbClimT2Mmean"
    pattern: "T2M_year_daily_mean_*.nc"   # 2008–2017

  # monthly deltas (CSV) — by target year
  t2m_deltas_csv:
    2030: "T2MmeanDeltas/T2M_mean_Rome_2030.csv"
    2040: "T2MmeanDeltas/T2M_mean_Rome_2040.csv"
    2050: "T2MmeanDeltas/T2M_mean_Rome_2050.csv"

impact_functions:
  pre_scale_mdd: 1e-3
  age_params:
    "<15":   {tau_days: 26.0, gamma: 2.0, impf_id: 1, name: "Heat mortality · <15"} # not tau days
    "15-64": {tau_days: 25.0, gamma: 2.3, impf_id: 2, name: "Heat mortality · 15-64"}
    "65+":   {tau_days: 18, gamma: 2.6, impf_id: 3, name: "Heat mortality · 65+"}
  baseline_per100k:
    "<15": 1.7
    "15-64": 70.0
    "65+": 3129.0
  total_target_per100k: 91.0
  heat_share: 1.0
  anchor_event: 2050

osm:
  query: "Roma, Italia"
  admin_levels: [10, 8, 7]
  boundary_tag: "administrative"
  keep_outside_bucket: true
  min_samples: 10

urbclim:
  folder: "UrbClim/UrbClimWBGTmax"
  variable_candidates: ["wbgt_max","WBGT_max","wbgt","WBGT"]
  thresh_wbgt: 28.0
  hot_months: [6, 7, 8, 9]
  f_bounds: [0.4, 1.0]

cooling_city_aliases: ["rome", "roma"]

income:
  city_aliases: ["Roma", "Roma Capitale"]
  columns:
    city: "Denominazione Comune"
    cap: "CAP"
    taxpayers: "Numero contribuenti"
    total_income: "Reddito complessivo - Ammontare in euro"