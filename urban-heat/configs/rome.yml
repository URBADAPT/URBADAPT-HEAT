slug: rome # city name 
city_name: Rome 
base_dir: data/Rome                
drive_manifest: data_manifests/rome_gdrive.json # all the data from the drive 

# demo / exposure scenario from Wittgenstein population runs scenarios 
# available: SSP1, SSP2, SSP3, SSP4, SSP5, SSP2DM, SSP2ZM
exp_scenario: SSP2   

layers:                             
  fua: fua
  cap: cap
  cap_wgs84: cap_wgs84
  regions: regions
  muni: muni

ac:
  ssp: 2 # AC data scenarios could be 1,3,5
  years: [2020, 2030, 2040, 2050]
  year: 2050

  # AC electricity consumption at NUTS level
  kwh_file: ACgridded/ac_kwh_NUTSregions.csv
  kwh_format: nuts_csv
  kwh_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  # AC penetration 
  penetration_file: ACgridded/ac_penetration_NUTSregions.csv # or ACgridded/ac_penetration_ssp1_ssp2_ssp3_ssp5_2020_2050.nc
  penetration_format: nuts_csv # to delete if it's the nc
  nuts_id: ITI43
  nuts_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  tariff_eur_per_kwh: 0.25
  capex_per_user: 500.0
  maint_rate: 0.05
  lifetime_years: 10
  
trees:                               
  capex_per_index_pt_eur: 10000000
  capex_per_tree_eur: 210
  om_per_tree_per_year_eur: 27
  lifetime_years: 25
  ramp_years: 12
  cap_uplift_0_1: 0.12
  focus_year: 2050
  
cba:
  discount_rate: 0.03
  horizon_years: 25

climate:
  # which climate scenario to use from climate_change_provide_markups_avg.csv
  t2m_clim_scen_default: CurPol     # default scenario
  t2m_clim_scen_options: [CurPol, GS, SP, ssp585] # other scenario available 

  t2m_var: tas

  # optional: years for which to build future T2M (if omitted, we’ll fall back to ac.years)
  years: [2020, 2030, 2040, 2050]

  urbclim_api: # for the API of historical UrbClim data 
    enabled: true
    t2m_url: "https://provide.marvin.vito.be/ftp/compressed_daily/Rome/" 
    local_dir: "UrbClim/UrbClimT2Mmean"
    years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017]

efficacy_scenarios:
  sera_spain:
    "<15": 0.10
    "15-64": 0.14
    "65+": 0.20
  moderate:
    "<15": 0.20
    "15-64": 0.30
    "65+": 0.40
  optimistic:
    "<15": 0.30
    "15-64": 0.40
    "65+": 0.55
  flat_30:
    "<15": 0.30
    "15-64": 0.30
    "65+": 0.30

efficacy:
  "<15": 0.20
  "15-64": 0.30
  "65+": 0.40
  default: 0.30

files:                               
  gvi_csv: gviRome/gvi_Rome.csv
  lcz_candidates:
    - "LCZ/lcz_filter_v3.tif"
    - "LCZ/lcz_v3.tif"
  cooling_coeffs_csv: "CoolingEff/coefs_GVI_t2m.csv"
  income_csv: "income/Redditi_e_principali_variabili_IRPEF_su_base_subcom.csv"
  # daily baselines (UrbClim mean daily temperature)
  t2m_mean_daily_nc:
    dir: "UrbClim/UrbClimT2Mmean"
    pattern: "T2M_year_daily_mean_*.nc"   # 2008–2017

  # single climate deltas table (long format: city, year, clim_scen, var, month, delta)
  t2m_deltas_table: "T2MmeanDeltas/climate_change_provide_markups_avg.csv"

osm:
  query: "Roma, Italia"
  admin_levels: [10, 8, 7]
  boundary_tag: "administrative"
  keep_outside_bucket: true
  min_samples: 10

urbclim:
  folder: "UrbClim/UrbClimWBGTmax"
  variable_candidates: ["wbgt_max","WBGT_max","wbgt","WBGT"]
  thresh_wbgt: 28.0
  hot_months: [6, 7, 8, 9]
  f_bounds: [0.4, 1.0]

cooling_city_aliases: ["rome", "roma"]

income:
  city_aliases: ["Roma", "Roma Capitale"]
  columns:
    city: "Denominazione Comune"
    cap: "CAP"
    taxpayers: "Numero contribuenti"
    total_income: "Reddito complessivo - Ammontare in euro"

vulnerability: 
    enabled: true 
    weights:
        thermal: 0.333 
        foreign_born: 0.333
        unemployment: 0.333 
    files:
        ghs_age: "vulnerability/GHS_AGE_1975052020_GLOBE_R2025A_54009_100_V1_0.tif"
        census_pop: "vulnerability/ESTAT_OBS-VALUE-T_2021_V2.tiff"
        census_oth: "vulnerability/ESTAT_OBS-VALUE-OTH_2021_V2.tiff"
        census_emp: "vulnerability/ESTAT_OBS-VALUE-EMP_2021_V2.tiff"
        census_working_age: "vulnerability/ESTAT_OBS-VALUE-Y_1564_2021_V2.tiff"
    census_nodata: -9999

ews:
  # Threshold settings
  # Method: 'fixed' (use threshold_c) or 'percentile' (compute from data)
  threshold_method: fixed
  threshold_c: 26.0              # Used if method='fixed'
  threshold_percentile: 85       # Used if method='percentile'
  threshold_ref_year: 2020       # Reference year for percentile calc
  
  # Warning season (May-September)
  warning_months: [5, 6, 7, 8, 9]
  
  # INTERPRETATION 
  # 'marginal': conservative - damage functions already embed existing HHWWS effect
  #             use for realistic cost-effectiveness of NEW investments
  # 'counterfactual': shows what HHWWS prevents (full literature efficacy)
  #                   use for policy justification
  interpretation: marginal
  
  # Efficacy scenarios for COUNTERFACTUAL interpretation
  # (What if no HHWWS existed?)
  efficacy_counterfactual:
    low: 0.20      # HHWWS-only (Italy paper: 22%)
    central: 0.35  # Between HHWWS and full plan
    high: 0.50     # Full heat plan (Italy paper: 57%)
  
  # Efficacy scenarios for MARGINAL interpretation
  # (Additional benefit from enhancement)
  efficacy_marginal:
    low: 0.05      # Modest improvement
    central: 0.10  # Moderate enhancement
    high: 0.15     # Ambitious enhancement
  
  # Ramp-up period 
  # Italy paper: effects NOT significant years 0-3, then strong
  ramp_years: 3
  ramp_initial_efficacy: 0.10
  
  # Cost parameters (EUR, 2020 prices)
  capex_setup: 140000           # One-time setup
  opex_per_warning_day: 6000    # Per warning day (system + response)
  opex_annual_fixed: 50000      # Annual fixed maintenance

# Rome-specific calibration notes:
# Threshold analysis from NB4:
#   - Max daily mean T2M: 28.2-28.9°C (never reaches 30°C!)
#   - 90th percentile: 26.7°C (11-35 warning days, high variability)
#   - 85th percentile: 26.5°C (45-62 warning days, more stable)
#   - Italy paper's 30°C threshold gives ZERO warning days!
#
# Recommendation: 26°C fixed threshold
#   - ~57 warning days/year average
#   - Captures ~70-80% of heat deaths (computed, not assumed)
#   - Stable across climate scenarios


    
