slug: genova
city_name: Genova
base_dir: data/Genova           
drive_manifest: data_manifests/genova_gdrive.json

layers:                             
  fua: fua
  cap: cap
  cap_wgs84: cap_wgs84
  regions: regions
  muni: muni

ac:                                 
  ssp: 2
  year: 2050
  tariff_eur_per_kwh: 0.25
  capex_per_user: 500.0
  maint_rate: 0.05
  lifetime_years: 10
  gridded_file: ACgridded/ac_kWh_ssp1_ssp2_ssp3_ssp5_2010_2050.nc
  penetration_file: ACgridded/ac_penetration_ssp1_ssp2_ssp3_ssp5_2020_2050.nc

trees:                               
  capex_per_index_pt_eur: 10000000
  capex_per_tree_eur: 210
  om_per_tree_per_year_eur: 27
  lifetime_years: 25
  ramp_years: 12
  cap_uplift_0_1: 0.12
  focus_year: 2050

cba:
  discount_rate: 0.03
  horizon_years: 25

efficacy:                            
  "<15": 0.20
  "15-64": 0.30
  "65+": 0.40
  default: 0.30

files:                               
  gvi_csv: gviGenova/gvi_Genova.csv
  lcz_candidates:
    - "LCZ/lcz_filter_v3.tif"
    - "LCZ/lcz_v3.tif"
  cooling_coeffs_csv: "CoolingEff/outer_2_wbgt_max.csv"
  income_csv: "income/Redditi_e_principali_variabili_IRPEF_su_base_subcom.csv"
  t2m_mean_daily_nc:
    dir: "UrbClim/UrbClimT2Mmean"
    pattern: "T2M_year_daily_mean_*.nc"   # 2008–2017
  t2m_deltas_csv:
    2030: "T2MmeanDeltas/T2_mean_Genova_2030.csv"
    2040: "T2MmeanDeltas/T2_mean_Genova_2040.csv"
    2050: "T2MmeanDeltas/T2_mean_Genova_2050.csv"

osm:
  query: "Genova, Italia"
  admin_levels: [10, 8, 7]
  boundary_tag: "administrative"
  keep_outside_bucket: true
  min_samples: 10
  exclude_region_ids: []      

urbclim:
  folder: "UrbClim/UrbClimWBGTmax"
  variable_candidates: ["wbgt_max","WBGT_max","wbgt","WBGT"]
  thresh_wbgt: 28.0
  hot_months: [6, 7, 8, 9]
  f_bounds: [0.4, 1.0]

cooling_city_aliases: ["genova", "genoa"]

income:
  city_aliases: ["Genova"]
  columns:
    city: "Denominazione Comune"
    cap: "CAP"
    taxpayers: "Numero contribuenti"
    total_income: "Reddito complessivo - Ammontare in euro"