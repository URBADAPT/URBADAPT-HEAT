slug: lisbon # city name 
city_name: Lisbon 
wp_iso3: PRT
wp_country: Portugal
base_dir: data/Lisbon                
drive_manifest: data_manifests/lisbon_gdrive.json # all the data from the drive 

# demo / exposure scenario from Wittgenstein population runs scenarios 
# available: SSP1, SSP2, SSP3, SSP4, SSP5, SSP2DM, SSP2ZM
exp_scenario: SSP2   

layers:                             
  fua: fua
  cap: cap
  cap_wgs84: cap_wgs84
  regions: regions
  muni: muni

ac:
  ssp: 2 # AC data scenarios could be 1,3,5
  years: [2020, 2030, 2040, 2050]
  year: 2050

  # AC electricity consumption at NUTS level
  kwh_file: ACgridded/ac_kwh_NUTSregions.csv
  kwh_format: nuts_csv
  kwh_nuts_ids: ["PT17", "PT170"]
  kwh_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  # AC penetration
  penetration_file: ACgridded/ac_penetration_NUTSregions.csv
  penetration_format: nuts_csv
  penetration_nuts_ids: ["PT17", "PT170"]
  nuts_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  tariff_eur_per_kwh: 0.17   # PRT ely_prices.xlsx (2021 USD @ 0.846 EUR/USD)
  capex_per_user: 1336   # €1543 2018 installed (product+€800) x PLI 86.6/100 [CALIB_AC S5]
  maint_rate: 0.04   # prEN 15459:2006 via Lot-10: 4%/yr of purchase+install [CALIB_AC S3]
  lifetime_years: 12   # Lot-10 Task4 / 2018 review; UQ range 9-16 [CALIB_AC S3]

  # AC waste heat feedback (Salamanca et al. 2014 + Kou et al. 2026)
  waste_heat:
    enabled: true
    lut_case_default: central          # low / central / high
    lut_case_options: [low, central, high]
    dailymean_from_night_default: 0.50
    dailymean_from_night_range: [0.33, 0.67]  # for UQ sampling
    activation:
      method: kou_cdd_share
      temperature_metric: citymean_dailymean
      t_on_c: 18.0
      t_full_c: 25.0

    # Salamanca 2014 LUT: penetration → nighttime ΔT (°C)
    lut:
      0.00: {low: 0.00, central: 0.00, high: 0.00}
      0.35: {low: 0.25, central: 0.375, high: 0.50}
      0.65: {low: 0.50, central: 0.750, high: 1.00}
      1.00: {low: 1.00, central: 1.250, high: 1.50}

    # COP degradation feedback (Kou et al. 2026)
    cop_degradation:
      enabled: true
      # COP sensitivity: fractional drop per °C of outdoor T rise
      # Kou et al. 2026 Fig.2a: 4-9% per °C
      sensitivity_per_C: {low: 0.04, central: 0.065, high: 0.09}
      # Reference COP (typical residential split AC)
      cop_ref: 3.0

trees:
  capex_per_index_pt_eur: 10000000
  capex_per_tree_eur: 606   # park/low-engineering base x PLI 86.6/100 [D5.1/Prague; CALIB_AC S7]
  om_per_tree_per_year_eur: 56   # park/low-engineering O&M base x PLI/100 [D5.1/Vogt; CALIB_AC S7]
  lifetime_years: 25
  ramp_years: 12
  cap_uplift_0_1: 0.12
  focus_year: 2050

  # vegetation policy regions (NB07)
  # Lisbon: use zones (Freguesias, admin_level=8)
  veg_regions: zones
  veg_region_label: Freguesia
  veg_emulator_bundle: "emulator/bundles/emulator_bundle_pooled_all_quadratic_holdout_safe.json"
  
electricity_feedback:
  enabled: true
  source: "Falchetta_DeCian_Lunghi_2026"
  pct_reduction_per_gvi_point: 0.008   # PLACEHOLDER = flat 0.008 (Falchetta 2026 Fig5 @~30C); recompute per-city from JJA-Tmax once city_summer_tmax.csv is filled [calibration/gen_gvi_reduction.py]
  summer_months: 3
  co2_intensity_gCO2_per_kwh: 72     # PRT EEA 2024 grid emission intensity (gCO2e/kWh)

cba:
  discount_rate: 0.03
  horizon_years: 25

climate:
  # which climate scenario to use from climate_change_provide_markups_avg.csv
  t2m_clim_scen_default: CurPol     # default scenario
  t2m_clim_scen_options: [CurPol, GS, SP, ssp585] # other scenario available 
  # baseline year construction mode for UrbClim 2008-2017 data
  # options:
  # - climatology_mean: month/day climatological mean (current default)
  # - pixelwise_doy_max: pixelwise month/day maxima (extreme sensitivity)
  # - domain_peak_day: daily sequence from the year containing the hottest domain-mean day
  # - warmest_summer: daily sequence from the year with highest JJA domain-mean temperature
  t2m_baseline_mode_default: climatology_mean
  t2m_baseline_mode_options: [climatology_mean, pixelwise_doy_max, domain_peak_day, warmest_summer]

  # uncertainty band for future climate deltas (across-GCM spread)
  # low = GCM p25, central = GCM median, high = GCM p75
  # (PROVIDE within-month percentiles are NOT uncertainty — see build_delta_bands.py)
  # requires climate_change_provide_markups_bands.csv (built by scripts/build_delta_bands.py)
  t2m_delta_pct_band_default: central
  t2m_delta_pct_band_options: [low, central, high]

  # using  mean daily temperature (tas)
  t2m_var: tas

  # optional: years for which to build future T2M (if omitted, we’ll fall back to ac.years)
  years: [2020, 2030, 2040, 2050]

  urbclim_api: # for the API of historical UrbClim data 
    enabled: true
    t2m_url: "https://provide.marvin.vito.be/ftp/compressed_daily/Lisbon/" 
    local_dir: "UrbClim/UrbClimT2Mmean"
    years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017]

efficacy_scenarios:
  sera_spain:
    "<15": 0.10
    "15-64": 0.14
    "65+": 0.20
  moderate:
    "<15": 0.20
    "15-64": 0.30
    "65+": 0.40
  optimistic:
    "<15": 0.30
    "15-64": 0.40
    "65+": 0.55
  flat_30:
    "<15": 0.30
    "15-64": 0.30
    "65+": 0.30

efficacy:
  "<15": 0.20
  "15-64": 0.30
  "65+": 0.40
  default: 0.30

files:                               
  gvi_csv: gvi/gvi_356_cities.csv
  lcz_candidates:
    - "LCZ/lcz_filter_v3.tif"
    - "LCZ/lcz_v3.tif"
  cooling_coeffs_csv: "CoolingEff/coefs_GVI_lst.csv"
  income_csv: "income/df_pt_lisbon_freguesia_income_2023.csv"
  # daily baselines (UrbClim mean daily temperature)
  t2m_mean_daily_nc:
    dir: "UrbClimT2Mmean"
    pattern: "T2M_year_daily_mean_*.nc"

  # single climate deltas table (long format: city, year, clim_scen, var, month, delta)
  t2m_deltas_table: "T2MmeanDeltas/climate_change_provide_markups_avg.csv"

osm:
  query: "Lisbon, Portugal"
  admin_levels: [10, 8, 7]
  boundary_tag: "administrative"
  keep_outside_bucket: true
  min_samples: 10

urbclim:
  folder: "UrbClim/UrbClimWBGTmax"
  variable_candidates: ["wbgt_max","WBGT_max","wbgt","WBGT"]
  thresh_wbgt: 28.0
  hot_months: [6, 7, 8, 9]
  f_bounds: [0.4, 1.0]

cooling_city_aliases: ["lisbon", "lisboa"]

income:
  source: observed          # observed | emulator (NB05 income source; see cityheat.income_source)
  city_aliases: ["Lisbon", "Lisboa"]
  columns:
    city: "municipality"          # filter column
    zone_id: "freguesia_code"     # spatial unit code (for code-based matching)
    zone_name: "freguesia"        # spatial unit name (for name-based OSM matching)
    income: "income_main_eur"     # income measure (already per-capita)
    count: null                   # taxpayer count (null = pre-aggregated)
    year: "year"                  # year column (null = single snapshot)
  aggregation: "mean"             # "weighted" (by count) or "mean"

zones:
  source: "osm"                   # "osm" or "shapefile"
  shapefile: null                 # path if source=shapefile
  shapefile_zone_col: null        # column in shapefile for zone code
  osm_admin_level: 8              # admin level for boundaries
  match_by: "name"                # "name" (normalised) or "code" (exact/padded)
  cache_file: "freguesia_lisbon.gpkg"

regions:
  enabled: false                  # Lisbon uses zones as policy regions (Freguesias)
  source: "osm"
  osm_admin_level: 7
  cache_file: null

vulnerability: 
    enabled: true 
    weights:
        thermal: 0.333 
        foreign_born: 0.333
        unemployment: 0.333 
    svi_min_valid_components: 2
    files:
        ghs_age: "vulnerability/GHS_AGE_1975052020_GLOBE_R2025A_54009_100_V1_0.tif"
        census_pop: "vulnerability/ESTAT_OBS-VALUE-T_2021_V2.tiff"
        census_oth: "vulnerability/ESTAT_OBS-VALUE-OTH_2021_V2.tiff"
        census_emp: "vulnerability/ESTAT_OBS-VALUE-EMP_2021_V2.tiff"
        census_working_age: "vulnerability/ESTAT_OBS-VALUE-Y_1564_2021_V2.tiff"
    census_nodata: -9999
    dynamic:
        enabled: true   # DRMKC and GVI inputs are now in place; projected vulnerability is the active workflow
        baseline_year: 2021
        population_baseline_year: 2020
        years: [2020, 2030, 2040, 2050]
        drmkc:
            file: "vulnerability/drmkc_vulnerability_projection.csv"
            # Use the current DRMKC NUTS3 code that contains the Lisbon municipality
            # and its subcity policy zones. PT170 is a legacy code and is not present
            # in the exported DRMKC vulnerability table.
            region_id: "PT1A0"
            effect_signs:
                foreign_born: 1.0
                unemployment: -1.0
        gvi:
            file: "vulnerability/gvi_projections.csv"
            country_code: "PRT"
        foreign_born_projection:
            q_low: 0.05
            q_high: 0.95
            drmkc_scale: 0.04
            gvi_scale: 0.35
        unemployment_projection:
            q_low: 0.05
            q_high: 0.95
            drmkc_scale: 0.08
            gvi_scale: 0.50
        # Lisbon: allow somewhat faster convergence because recent redevelopment pressure is stronger
        k:
            default: 0.72
            foreign_born: 0.70
            unemployment: 0.75
        phi:
            default_2030: 0.88
            default_2050: 0.65
            foreign_born_2030: 0.88
            foreign_born_2050: 0.65
            unemployment_2030: 0.86
            unemployment_2050: 0.60
        thermal_projection:
            retrofit_rate_per_year: 0.0139   # EC 2019 weighted renovation rate (Table2 rate x Table4 savings; winter-PE proxy) [calibration/retrofit_source_ec2019.csv]
            new_build_vulnerability: 0.15   # constant EU-wide: EPBD nZEB (all new builds >=2021) + age already differentiated; nZEB overheating = UQ sensitivity [CALIB]
            growth_sensitivity: 0.80
            growth_cap: 0.35

ews:
  # ARCHETYPE C: Marginal enhancement of mature ICARO system
  # Context: Portugal's ICARO system operational since 1999 (INSA/IPMA).
  # Formal contingency plan (DGS) since 2004, updated yearly.
  # Bittner et al. 2014: Portugal scored 17.5/20 (highest in study)
  # Lowe et al. 2011: Table 1 confirms ICARO (Tmax/Tmin/ICARUS index)
  # Urban et al. 2025: Portugal HAF = -10%
  # Bulhosa 2019 (ULisbon MSc): ICARO uses GATO index with dynamic
  #   threshold (29-35C), calibrated on 1981/1991 Lisbon heatwaves.
  #   DLNM proposed as update with better specificity.
  # Goncalves 2009: Three alert levels (green/yellow/red),
  #   season May 15-Sep 30, activities include home visits to elderly,
  #   phone contacts, radio alerts, institutional coordination.
  #
  # Policy modeled: marginal enhancement of existing ICARO system
  # (improved DLNM forecasting per Bulhosa 2019, better targeting
  # of vulnerable groups, expanded digital communication channels)
  archetype: mature_hybrid_icaro
  operational_trigger_mode: epi_deaths_file
  warning_season:
    mode: exact_dates
    start_md: "05-15"
    end_md: "09-30"
# these are things that we could add, right now don't exist 
  alert_tiers:
    levels: ["green", "yellow", "red"]
    source: "ICARO / DGS operational structure"
  targeting:
    primary_groups: ["65+", "chronic conditions", "socially isolated"]
    channels: ["health services", "civil protection", "media and SMS alerts"]
  cost_components:
    model_default: pavanello
    source_note: "See pavanello/chiabai subsections below"

  # Threshold 
  threshold_method: epi_deaths_file
  threshold_file: null
  threshold_key: threshold_deaths_per_day
  threshold_unit: heat_deaths_per_day
  target_activation_days: 23
  target_activation_days_options: [15, 23]
  threshold_ref_year: 2020
  threshold_recalib_interval: 5   # recalibrate every N years (GHHIN guidance)
  threshold_recalib_interval_options: [3, 5, 7]
  warning_months: [5, 6, 7, 8, 9]

  # Interpretation 
  # Marginal: ICARO is already operational and mature (Bittner 17.5/20).
  # We model only the INCREMENTAL benefit of enhancing the existing system.
  interpretation: marginal

  # Efficacy (counterfactual — for sensitivity, not primary) 
  # If Lisbon had NO system and we built one from scratch.
  # Urban 2025: Portugal HAF -10% (total, not HHWWS-specific)
  # Pavanello 2024: 22% HHWWS-specific (Italy, similar mature system)
  efficacy_counterfactual:
    low: 0.10
    central: 0.20
    high: 0.35

  # Marginal efficacy (primary for Lisbon, age-differentiated) 
  # Sources: Urban 2025 Portugal -10% total (lower than Italy -11.6%),
  #   system already highly mature (17.5/20) → diminishing returns.
  # Enhancement modeled: improved DLNM forecasting (Bulhosa 2019),
  #   expanded vulnerable-group targeting, digital communication.
  # Slightly lower than Rome's marginal efficacy: higher maturity
  #   (17.5/20 vs 15/20) paradoxically means LESS room for improvement.
  efficacy_marginal:
    "<15":   {low: 0.01, central: 0.03, high: 0.06}
    "15-64": {low: 0.02, central: 0.05, high: 0.10}
    "65+":   {low: 0.05, central: 0.10, high: 0.18}

  # Ramp-up 
  # Short ramp: ICARO infrastructure already exists since 1999.
  # Enhancement leverages existing alert channels, institutional
  # relationships, and trained health personnel (Goncalves 2009).
  ramp_years: 3   # Pavanello & Valenti 2025 Fig 4(c): HHWWS effect emerges after ~yr3 [CALIB_EWS S6]
  ramp_initial_efficacy: 0.1   # Pavanello Fig 4(c): near-zero yr0-3 then ramps [CALIB_EWS S6]

  # Costs 
  # Two models: pavanello (population-based, default) and chiabai (per-day fixed)
  cost_model: pavanello

  # Pavanello & Valenti 2024 via Ebi et al. 2004 (Philadelphia HHWS):
  # $0.014/capita/activation day operating costs
  pavanello:
    usd_per_capita_per_day: 0.014   # Pavanello & Valenti 2025 (WP 35.2025) via Ebi 2004 [CALIB_EWS S6]
    eur_usd_rate: 0.92
    cost_source: "Pavanello & Valenti 2024 via Ebi et al. 2004 (Philadelphia HHWS)"

  # Chiabai et al. 2018 (Madrid) Table 4 — for sensitivity analysis
  # Lisbon is enhancing existing system → incremental costs apply
  chiabai:
    opex_per_warning_day_basic: 7374   # Chiabai 2018 €7800 Madrid x PLI/PLI_ES [CALIB_EWS S3]
    opex_per_warning_day_enhanced: 13236   # Chiabai €14000 x PLI/PLI_ES [CALIB_EWS S3]
    opex_per_warning_day_incremental: 5862   # Chiabai increment €6200 x PLI/PLI_ES [CALIB_EWS S3]
    cost_source: "Chiabai et al. 2018 (Spain/Madrid) Table 4 (projected 2020; base EUR 2013)"

  # No setup costs: ICARO already operational since 1999
  capex_setup: 0   # 3-tier EWS taxonomy Tier 1 (epidemiological/mature): 0/75k/150k setup CAPEX; full=$150k Ebi2004 via Takacs [ews_taxonomy_v4]
  opex_annual_fixed: 189083   # Rao 2025 standing HHWS cost €200k/yr x PLI/PLI_ES [CALIB_EWS S5]
  cost_scale_with_population: true
  cost_ramp_with_efficacy: true

  # AC-EWS interaction 
  # Portugal has very low AC penetration (around 5-10% residential, Eurostat).
  # Minimal overlap: almost no deaths already prevented by AC,
  # so EWS addresses a wider pool of at-risk population.
  # Sera 2020: AC explains only 14-20% of adaptation in Southern Europe.
  ac_overlap_factor: {low: 0.10, central: 0.20, high: 0.40}

  # Mortality displacement (harvesting) 
  # Physiological phenomenon, not policy-dependent.
  displacement:
    "<15":   {low: 0.05, central: 0.10, high: 0.20}
    "15-64": {low: 0.05, central: 0.10, high: 0.20}
    "65+":   {low: 0.10, central: 0.25, high: 0.40}

  # Life-years for cost-effectiveness 
  # Portugal life tables (approximate residual life expectancy by age group)
  # Portugal life expectancy at birth around 81.6 years (Eurostat 2020) => could need more calibration
  residual_life_years:
    "<15": 60
    "15-64": 25
    "65+": 12
