slug: copenhagen
city_name: Copenhagen
wp_iso3: DNK
wp_country: Denmark
base_dir: data/copenhagen
drive_manifest: data_manifests/copenhagen_gdrive.json

exp_scenario: SSP2

layers:
  fua: fua
  cap: cap
  cap_wgs84: cap_wgs84
  regions: regions
  muni: muni

ac:
  ssp: 2
  years: [2020, 2030, 2040, 2050]
  year: 2050

  kwh_file: ACgridded/ac_kwh_NUTSregions.csv
  kwh_format: nuts_csv
  kwh_nuts_ids: ["DK011"]
  kwh_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  penetration_file: ACgridded/ac_penetration_NUTSregions.csv
  penetration_format: nuts_csv
  penetration_nuts_ids: ["DK011"]
  nuts_columns:
    id: NUTS_ID
    scenario: Scenario
    year: year
    value: value

  tariff_eur_per_kwh: 0.30   # DNK ely_prices.xlsx (2021 USD @ 0.846 EUR/USD)
  capex_per_user: 2156   # €1543 2018 installed (product+€800) x PLI 139.7/100 [CALIB_AC S5]
  maint_rate: 0.04   # prEN 15459:2006 via Lot-10: 4%/yr of purchase+install [CALIB_AC S3]
  lifetime_years: 12   # Lot-10 Task4 / 2018 review; UQ range 9-16 [CALIB_AC S3]

  waste_heat:
    enabled: true
    lut_case_default: central
    lut_case_options: [low, central, high]
    dailymean_from_night_default: 0.50
    dailymean_from_night_range: [0.33, 0.67]
    activation:
      method: kou_cdd_share
      temperature_metric: citymean_dailymean
      t_on_c: 18.0
      t_full_c: 25.0
    lut:
      0.00: {low: 0.00, central: 0.00, high: 0.00}
      0.35: {low: 0.25, central: 0.375, high: 0.50}
      0.65: {low: 0.50, central: 0.750, high: 1.00}
      1.00: {low: 1.00, central: 1.250, high: 1.50}
    cop_degradation:
      enabled: true
      sensitivity_per_C: {low: 0.04, central: 0.065, high: 0.09}
      cop_ref: 3.0

trees:
  capex_per_index_pt_eur: 10000000
  capex_per_tree_eur: 978   # park/low-engineering base x PLI 139.7/100 [D5.1/Prague; CALIB_AC S7]
  om_per_tree_per_year_eur: 91   # park/low-engineering O&M base x PLI/100 [D5.1/Vogt; CALIB_AC S7]
  lifetime_years: 25
  ramp_years: 12
  cap_uplift_0_1: 0.12
  focus_year: 2050
  veg_regions: zones
  veg_region_label: Bydel
  veg_emulator_bundle: "emulator/bundles/emulator_bundle_pooled_all_quadratic_holdout_safe.json"

electricity_feedback:
  enabled: true
  source: "Falchetta_DeCian_Lunghi_2026"
  pct_reduction_per_gvi_point: 0.008   # PLACEHOLDER = flat 0.008 (Falchetta 2026 Fig5 @~30C); recompute per-city from JJA-Tmax once city_summer_tmax.csv is filled [calibration/gen_gvi_reduction.py]
  summer_months: 3
  co2_intensity_gCO2_per_kwh: 76     # DNK EEA 2024 grid emission intensity (gCO2e/kWh)

cba:
  discount_rate: 0.03
  horizon_years: 25

climate:
  t2m_clim_scen_default: CurPol
  t2m_clim_scen_options: [CurPol, GS, SP, ssp585]
  t2m_baseline_mode_default: climatology_mean
  t2m_baseline_mode_options: [climatology_mean, pixelwise_doy_max, domain_peak_day, warmest_summer]
  t2m_delta_pct_band_default: central
  t2m_delta_pct_band_options: [low, central, high]
  t2m_var: tas
  years: [2020, 2030, 2040, 2050]
  urbclim_api:
    enabled: true
    t2m_url: "https://provide.marvin.vito.be/ftp/compressed_daily/Copenhagen/"
    local_dir: "UrbClim/UrbClimT2Mmean"
    years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017]

extreme_hazard:
  enabled: true
  run_standard_track: true
  run_extreme_track: true
  standard_track:
    name: standard_dailymean
    run_policies: false
  event_track:
    name: heatwave_extreme
    season:
      mode: exact_dates
      start_md: "05-15"
      end_md: "09-30"
    threshold_baseline_mode_default: climatology_mean
    threshold_baseline_mode_options: [climatology_mean, historical_dailymean]
    threshold_percentile_default: 95
    threshold_percentile_options: [95, 93, 92, 90]
    min_duration_default: 3
    min_duration_options: [3, 2]
    min_event_days_required: 3
    intensity_method: exceedance
    t_ref_mode_default: local_p90
    t_ref_mode_options: [local_p90, fixed_20c]
    t_ref_baseline_mode_default: climatology_mean
    t_ref_baseline_mode_options: [climatology_mean, historical_dailymean]
    t_ref_fixed_c: 20.0
    t_ref_percentile_default: 90
    t_ref_percentile_options: [85, 90, 95]
    cold_city_if_variant: true

efficacy_scenarios:
  sera_spain:
    "<15": 0.10
    "15-64": 0.14
    "65+": 0.20
  moderate:
    "<15": 0.20
    "15-64": 0.30
    "65+": 0.40
  optimistic:
    "<15": 0.30
    "15-64": 0.40
    "65+": 0.55
  flat_30:
    "<15": 0.30
    "15-64": 0.30
    "65+": 0.30

efficacy:
  "<15": 0.20
  "15-64": 0.30
  "65+": 0.40
  default: 0.30

files:
  gvi_csv: gvi/gvi_356_cities.csv
  lcz_candidates:
    - "LCZ/lcz_filter_v3.tif"
    - "LCZ/lcz_v3.tif"
  cooling_coeffs_csv: "CoolingEff/coefs_GVI_lst.csv"
  income_csv: "income/df_dk_copenhagen_district_income_2023.csv"
  t2m_mean_daily_nc:
    dir: "UrbClimT2Mmean"
    pattern: "T2M_year_daily_mean_*.nc"
  t2m_deltas_table: "T2MmeanDeltas/climate_change_provide_markups_avg.csv"

osm:
  query: "Copenhagen, Denmark"
  admin_levels: [10, 8, 7]
  boundary_tag: "administrative"
  keep_outside_bucket: true
  min_samples: 10

urbclim:
  folder: "UrbClim/UrbClimWBGTmax"
  variable_candidates: ["wbgt_max", "WBGT_max", "wbgt", "WBGT"]
  thresh_wbgt: 28.0
  hot_months: [6, 7, 8, 9]
  f_bounds: [0.4, 1.0]

cooling_city_aliases: ["copenhagen", "kobenhavn", "københavn"]

income:
  source: observed          # observed | emulator (NB05 income source; see cityheat.income_source)
  city_aliases: ["Copenhagen", "København"]
  format: "tabular"
  columns:
    city: "municipality"
    zone_id: null
    zone_name: "district"
    income: "income_main_eur"
    count: null
    year: "year"
    lon: null
    lat: null
  aggregation: "mean"

zones:
  source: "shapefile"
  shapefile: "boundaries/bydel.json"
  shapefile_zone_col: "name"
  osm_admin_level: null
  match_by: "name"
  cache_file: "bydele_copenhagen.gpkg"

regions:
  enabled: false
  source: "shapefile"
  shapefile: "boundaries/bydel.json"
  shapefile_id_col: null
  shapefile_name_col: "name"
  osm_admin_level: null
  cache_file: null

vulnerability:
  enabled: true
  weights:
    thermal: 0.333
    foreign_born: 0.333
    unemployment: 0.333
  svi_min_valid_components: 2
  files:
    ghs_age: "vulnerability/GHS_AGE_1975052020_GLOBE_R2025A_54009_100_V1_0.tif"
    census_pop: "vulnerability/ESTAT_OBS-VALUE-T_2021_V2.tiff"
    census_oth: "vulnerability/ESTAT_OBS-VALUE-OTH_2021_V2.tiff"
    census_emp: "vulnerability/ESTAT_OBS-VALUE-EMP_2021_V2.tiff"
    census_working_age: "vulnerability/ESTAT_OBS-VALUE-Y_1564_2021_V2.tiff"
  census_nodata: -9999
  dynamic:
    enabled: true
    baseline_year: 2021
    population_baseline_year: 2020
    years: [2020, 2030, 2040, 2050]
    drmkc:
      file: "vulnerability/drmkc_vulnerability_projection.csv"
      region_id: "DK011"
      effect_signs:
        foreign_born: 1.0
        unemployment: -1.0
    gvi:
      file: "vulnerability/gvi_projections.csv"
      country_code: "DNK"
    foreign_born_projection:
      q_low: 0.05
      q_high: 0.95
      drmkc_scale: 0.04
      gvi_scale: 0.35
    unemployment_projection:
      q_low: 0.05
      q_high: 0.95
      drmkc_scale: 0.08
      gvi_scale: 0.50
    k:
      default: 0.70
      foreign_born: 0.75
      unemployment: 0.65
    phi:
      default_2030: 0.86
      default_2050: 0.60
      foreign_born_2030: 0.86
      foreign_born_2050: 0.60
      unemployment_2030: 0.85
      unemployment_2050: 0.58
    thermal_projection:
      retrofit_rate_per_year: 0.0065   # EC 2019 weighted renovation rate (Table2 rate x Table4 savings; winter-PE proxy) [calibration/retrofit_source_ec2019.csv]
      new_build_vulnerability: 0.14
      growth_sensitivity: 0.75
      growth_cap: 0.30

ews:
  archetype: cold_city_extreme_focus
  operational_trigger_mode: epi_deaths_file
  warning_season:
    mode: exact_dates
    start_md: "05-15"
    end_md: "09-30"
  alert_tiers:
    levels: ["advisory", "watch", "warning"]
    source: "Copenhagen adaptation pathway for warm-season extremes"
  targeting:
    primary_groups: ["65+", "chronic conditions", "socially isolated"]
    channels: ["health services", "municipal outreach", "digital alerts"]
  cost_components:
    model_default: pavanello
    source_note: "See pavanello/chiabai subsections below"
  threshold_method: epi_deaths_file
  threshold_file: null
  threshold_key: threshold_deaths_per_day
  threshold_unit: heat_deaths_per_day
  nonpositive_threshold_fallback: event_mask
  event_mask_file: null
  target_activation_days: 15
  target_activation_days_options: [10, 15, 23]
  threshold_ref_year: 2020
  threshold_recalib_interval: 5
  threshold_recalib_interval_options: [3, 5, 7]
  warning_months: [5, 6, 7, 8, 9]
  interpretation: counterfactual
  efficacy_counterfactual:
    low: 0.08
    central: 0.15
    high: 0.28
  efficacy_marginal:
    "<15": {low: 0.01, central: 0.03, high: 0.05}
    "15-64": {low: 0.02, central: 0.05, high: 0.09}
    "65+": {low: 0.04, central: 0.09, high: 0.16}
  ramp_years: 3
  ramp_initial_efficacy: 0.08
  cost_model: pavanello
  pavanello:
    usd_per_capita_per_day: 0.014   # Pavanello & Valenti 2025 (WP 35.2025) via Ebi 2004 [CALIB_EWS S6]
    eur_usd_rate: 0.92
    cost_source: "Pavanello & Valenti 2024 via Ebi et al. 2004 (Philadelphia HHWS)"
  chiabai:
    opex_per_warning_day_basic: 11896   # Chiabai 2018 €7800 Madrid x PLI/PLI_ES [CALIB_EWS S3]
    opex_per_warning_day_enhanced: 21352   # Chiabai €14000 x PLI/PLI_ES [CALIB_EWS S3]
    opex_per_warning_day_incremental: 9456   # Chiabai increment €6200 x PLI/PLI_ES [CALIB_EWS S3]
    cost_source: "Chiabai et al. 2018 (Spain/Madrid) Table 4 (projected 2020; base EUR 2013)"
  capex_setup: 100000
  opex_annual_fixed: 0
  cost_scale_with_population: true
  cost_ramp_with_efficacy: true
  ac_overlap_factor: {low: 0.10, central: 0.20, high: 0.40}
  displacement:
    "<15": {low: 0.05, central: 0.10, high: 0.20}
    "15-64": {low: 0.05, central: 0.10, high: 0.20}
    "65+": {low: 0.10, central: 0.25, high: 0.40}
  residual_life_years:
    "<15": 60
    "15-64": 25
    "65+": 12
